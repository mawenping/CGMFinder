[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgmfinder"
version = "1.0.0"
description = "Correlated gene module identification from scRNA-seq data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Wenping Ma", email = "mwp@pku.edu.cn"},
]
keywords = ["scRNA-seq", "gene-module", "correlated-gene-module", "CGM", "bioinformatics", "single-cell"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.10"
dependencies = [
    "scanpy>=1.9",
    "anndata>=0.9",
    "pandas>=1.5",
    "numpy>=1.24",
    "pyarrow>=10",
]

[project.urls]
Homepage = "https://github.com/alcoholwine/CGMFinder"

[project.scripts]
cgmfinder = "cgmfinder.cgmfinder:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cgmfinder*"]

[tool.setuptools.package-data]
cgmfinder = ["data/cell_cycle_genes.csv"]
